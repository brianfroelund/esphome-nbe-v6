substitutions:
  name: "nbe-v6-pellet-stove-d1"
  friendly_name: "NBE V6 Pellet Stove (ESP8266)"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: d1_mini

api:
  encryption:
    key: "!secret api_encryption_key"

ota:
  - platform: esphome

wifi:
  ssid: "!secret wifi_ssid"
  password: "!secret wifi_password"
  ap:
    ssid: "NBE-V6-Hotspot"
    password: "!secret wifi_ap_password"

captive_portal:

logger:
  level: DEBUG
  baud_rate: 0  # Disable UART0 serial logging so serial pins can be used

# Software UART or hardware UART on D1 Mini
# D7 (GPIO13) = RX, D8 (GPIO15) = TX connected through MAX3232 transceiver (3.3V)
uart:
  id: uart_nbe
  tx_pin: GPIO15
  rx_pin: GPIO13
  baud_rate: 9600
  stop_bits: 1
  data_bits: 8
  parity: NONE

external_components:
  - source:
      type: local
      path: components
    components: [ nbe_v6 ]

nbe_v6:
  id: nbe_hub
  uart_id: uart_nbe
  update_interval: 5s

sensor:
  - platform: nbe_v6
    nbe_v6_id: nbe_hub
    boiler_temperature:
      name: "Boiler Temperature"
    chute_temperature:
      name: "Chute Temperature"
    smoke_temperature:
      name: "Smoke Temperature"
    boiler_return_temperature:
      name: "Boiler Return Temperature"
    hot_water_temperature:
      name: "Hot Water Temperature"
    outdoor_temperature:
      name: "Outdoor Temperature"
    power_percent:
      name: "Burner Power Percent"
    power_kw:
      name: "Burner Power kW"
    oxygen:
      name: "Exhaust Oxygen"
    oxygen_desired:
      name: "Desired Oxygen"
    light:
      name: "Flame Sensor Light"
    feeder_time:
      name: "Auger Cycle Feeder Time"
    ignition_time:
      name: "Ignition Element Time"
    motor_runtime_hours:
      name: "Total Auger Runtime"
    ignition_runtime_hours:
      name: "Total Ignition Runtime"
    target_boiler_temperature:
      name: "Current Boiler Target Setpoint"

text_sensor:
  - platform: nbe_v6
    nbe_v6_id: nbe_hub
    mode:
      name: "Burner State / Mode"
    alarm:
      name: "Burner Alarm Status"
    version:
      name: "NBE Controller Firmware Version"

binary_sensor:
  - platform: nbe_v6
    nbe_v6_id: nbe_hub
    alarm_active:
      name: "Alarm Active"
    fire_detected:
      name: "Flame Detected"

switch:
  - platform: nbe_v6
    nbe_v6_id: nbe_hub
    burner:
      name: "Burner Power"

number:
  - platform: nbe_v6
    nbe_v6_id: nbe_hub
    boiler_temp_set:
      name: "Boiler Target Temperature"
    feeder_capacity:
      name: "Auger Feeder Capacity"

button:
  - platform: nbe_v6
    nbe_v6_id: nbe_hub
    reset_alarm:
      name: "Reset Alarm"
    reset_ignition:
      name: "Reset Ignition Counter"
